    <style>
        @import url('assets/fonts/inter.css');
        * { transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        
        .perspective { perspective: 1000px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flip-card-back { transform: rotateY(180deg); }
        
        .wiggle { animation: wiggle 0.4s ease-in-out; }
        @keyframes wiggle { 
            0%, 100% {transform: translateX(0);} 
            25% {transform: translateX(-5px);} 
            75% {transform: translateX(5px);} 
        }

        .pop-success { animation: popSuccess 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, pulseGlow 1.8s infinite ease-in-out; }
        @keyframes popSuccess { 
            0% { transform: scale(0.95); } 
            50% { transform: scale(1.03); } 
            100% { transform: scale(1); } 
        }
        @keyframes pulseGlow { 
            0%, 100% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); } 
            50% { box-shadow: 0 0 24px rgba(16, 185, 129, 0.8); } 
        }

        @keyframes bounceShort {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-short { animation: bounceShort 0.6s ease-in-out 2; }

        @keyframes timerBar {
            0% { width: 100%; }
            100% { width: 0%; }
        }
    
        .premium-progress{position:relative;overflow:hidden;background:linear-gradient(90deg,#0078d4 0%,#7c3aed 38%,#10b981 68%,#0078d4 100%);background-size:240% 100%;box-shadow:0 0 12px rgba(0,120,212,.34);animation:premiumProgressFlow 3.4s linear infinite}
        .premium-progress::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.72) 48%,transparent 76%);transform:translateX(-130%);animation:premiumProgressShine 2.3s ease-in-out infinite}
        @keyframes premiumProgressFlow{to{background-position:240% 0}}
        @keyframes premiumProgressShine{0%,35%{transform:translateX(-130%)}75%,100%{transform:translateX(130%)}}
        @media(prefers-reduced-motion:reduce){.premium-progress,.premium-progress::after{animation:none!important}}
</style>

            'usb-b': ['hdmi', 'dp', 'audio'],
            'micro-usb': ['lightning', 'usb-b', 'audio'],
            'lightning': ['usb-c', 'micro-usb', 'audio'],
            'sd-card': ['hdmi', 'audio', 'wlan-antenne'],
            'wlan-antenne': ['bt-dongle', 'rj45', 'usb-hub'],
            'usb-hub': ['usb-a', 'bt-dongle', 'rj45']
        };

        const TOTAL_QUESTIONS = 16;
        const MIN_CORRECT_TO_PASS = 13; // von 16 (max. 3 Fehler erlaubt)

        let timerInterval, startTime;
        let quizQueue = [];
        let currentQuestion = null;
        let errorCount = 0;
        let correctCount = 0;
        let errorDetails = [];
        let quizActive = false;
        let finalScore = 0;
        let hasPassed = localStorage.getItem('a4_passed') === 'true';

        // Dark Mode
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('ib-theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-amber-400 text-sm' : 'fa-solid fa-moon text-sm';
        }

        // Student Data Sync
        function syncInputs(){
            const sName = localStorage.getItem('studentVorname') || localStorage.getItem('student_vorname') || '';

            document.getElementById('studentName').value = sName || 'Gast';
            document.getElementById('studentClass').value = 'B24';
            document.getElementById('studentDate').value = new Date().toLocaleDateString('de-CH');

            // Anders als bei den anderen Arbeitsblättern fehlte hier bisher der Erstbesuch-Prompt:
            // ohne gespeicherten Vornamen blieb das Feld für immer auf "Gast" stehen.
            if (!sName) {
                setTimeout(() => {
                    const entered = prompt("Willkommen! Wie lautet dein Vorname?");
                    if (entered && entered.trim()) {
                        const clean = entered.trim();
                        localStorage.setItem('studentVorname', clean);
                        localStorage.setItem('student_vorname', clean);
                        document.getElementById('studentName').value = clean;
                    }
                }, 300);
            }
        }

        // Utility
        function formatTime(ms) {
            let s = Math.floor(ms / 1000);
            return (s < 10 ? '0' : '') + s + 's';
        }
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function updateProgress() {
            const percent = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
            document.getElementById('headerPercentText').textContent = `${correctCount} / ${TOTAL_QUESTIONS} richtig`;
            document.getElementById('headerPercentNumber').textContent = `${percent}%`;
            document.getElementById('headerSvgCircle').style.strokeDashoffset = String(100.53 * (1 - percent / 100));
            document.getElementById('progressBar').style.width = `${percent}%`;

            if(hasPassed) {
                const pdfBtn = document.getElementById('hdrPdfBtn');
                pdfBtn.classList.remove('opacity-60', 'cursor-not-allowed', 'text-slate-400');
                pdfBtn.classList.add('text-onedrive-500', 'border-onedrive-500', 'bg-onedrive-50', 'hover:bg-onedrive-100');
                pdfBtn.title = "PDF Zertifikat generieren";
            }
        }

        // Modes
        function switchMode(mode) {
            const btnS = document.getElementById('btnStudy');
            const btnQ = document.getElementById('btnQuiz');
            const pnlS = document.getElementById('studyMode');
            const pnlQ = document.getElementById('quizMode');

            if(mode === 'study') {
                quizActive = false;
                clearInterval(timerInterval);
                btnS.className = 'whitespace-nowrap px-4 py-2 text-sm font-bold rounded-lg transition-all bg-onedrive-500 text-white shadow-md cursor-default';
                btnQ.className = 'whitespace-nowrap px-4 py-2 text-sm font-bold rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer';
                pnlQ.classList.add('hidden');
                pnlS.classList.remove('hidden');
            } else {
                btnQ.className = 'whitespace-nowrap px-4 py-2 text-sm font-bold rounded-lg transition-all bg-onedrive-500 text-white shadow-md cursor-default';
                btnS.className = 'whitespace-nowrap px-4 py-2 text-sm font-bold rounded-lg transition-all text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 cursor-pointer';
                pnlS.classList.add('hidden');
                pnlQ.classList.remove('hidden');
                startQuiz();
            }
        }

        function renderStudyMode() {
            const grid = document.getElementById('flashcardGrid');
            grid.innerHTML = '';
            IODATA.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="perspective h-64 cursor-pointer group" onclick="this.querySelector('.flip-card').classList.toggle('flipped')">
                        <div class="flip-card w-full h-full">
                            <div class="flip-card-inner rounded-2xl shadow-md border border-slate-200 dark:border-slate-700 group-hover:shadow-xl transition-shadow">
                                <div class="flip-card-front bg-white dark:bg-slate-800 rounded-2xl overflow-hidden flex flex-col absolute inset-0 border-4 border-white dark:border-slate-800">
                                    <img src="${item.img}" class="w-full h-full object-cover rounded-xl">
                                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/80 to-transparent p-4 flex justify-end items-end rounded-b-xl">
                                        <i class="fa-solid fa-rotate text-white/70"></i>
                                    </div>
                                </div>
                                <div class="flip-card-back bg-onedrive-600 dark:bg-onedrive-700 text-white rounded-2xl p-6 flex flex-col justify-center items-center text-center absolute inset-0 overflow-hidden">
                                    <div class="absolute top-4 right-4"><i class="fa-solid fa-rotate text-white/50"></i></div>
                                    <h3 class="text-2xl font-black mb-3">${item.name}</h3>
                                    <p class="text-sm text-onedrive-100">${item.desc}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function startQuiz() {
            quizActive = true;
            errorCount = 0;
            correctCount = 0;
            errorDetails = [];
            quizQueue = shuffle([...IODATA]);
            
            document.getElementById('statFragen').textContent = '0/16';
            document.getElementById('statFehler').textContent = 0;
            document.getElementById('statPunkte').textContent = 0;
            updateProgress();
            
            clearInterval(timerInterval);
            startTime = performance.now();
            timerInterval = setInterval(() => {
                if(quizActive) {
                    document.getElementById('statZeit').textContent = formatTime(performance.now() - startTime);
                }
            }, 250);
            
            nextQuestion();
        }

        function nextQuestion() {
            if(quizQueue.length === 0) {
                endQuiz();
                return;
            }
            
            currentQuestion = quizQueue.shift();
            const currentNum = IODATA.length - quizQueue.length;
            document.getElementById('statFragen').textContent = `${currentNum}/16`;
            
            document.getElementById('scenarioTitle').textContent = currentQuestion.scenarioText;
            document.getElementById('quizImageEl').src = currentQuestion.scenarioImg;
            
            const distractorIds = DISTRACTORS[currentQuestion.id] || [];
            const wrongOptions = distractorIds
                .map(id => IODATA.find(item => item.id === id))
                .filter(Boolean);
            const allOptions = shuffle([currentQuestion, ...wrongOptions]);
            
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            
            allOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'relative w-full aspect-[4/3] rounded-2xl overflow-hidden shadow-sm border-4 border-white dark:border-slate-800 hover:border-onedrive-500 dark:hover:border-onedrive-500 hover:shadow-lg transition-all group';
                btn.dataset.id = opt.id;
                btn.innerHTML = `
                    <img src="${opt.img}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent p-3 sm:p-4 flex justify-center items-end h-2/3 opacity-90 group-hover:opacity-100 transition-opacity">
                        <span class="text-white font-bold text-base sm:text-lg drop-shadow-md text-center leading-tight">${opt.name}</span>
                    </div>
                `;
                btn.onclick = () => handleAnswer(btn, opt.id === currentQuestion.id, opt.name);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(btnElement, isCorrect, clickedName) {
            const allBtns = document.getElementById('quizOptions').querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.style.pointerEvents = 'none';
            });

            if(isCorrect) {
                correctCount++;
                updateProgress();
                btnElement.classList.add('border-emerald-500', 'ring-4', 'ring-emerald-500/50', 'pop-success', 'z-10');
                
                const checkOverlay = document.createElement('div');
                checkOverlay.className = 'absolute inset-0 bg-emerald-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center gap-2.5 z-20 p-2 text-center transition-all duration-300';
                checkOverlay.innerHTML = `
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-emerald-500 text-white flex items-center justify-center text-3xl shadow-xl animate-bounce-short">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <span class="bg-emerald-600 text-white font-black text-xs sm:text-sm px-4 py-1.5 rounded-full shadow-lg border border-emerald-400/40 tracking-wide">
                        Richtig! ✨
                    </span>
                    <div class="w-3/4 h-1.5 bg-emerald-950/80 rounded-full overflow-hidden mt-1 border border-emerald-500/30">
                        <div class="h-full bg-emerald-400 rounded-full transition-all duration-[2000ms] ease-linear w-full" style="animation: timerBar 2s linear forwards;"></div>
                    </div>
                `;
                btnElement.appendChild(checkOverlay);
                
                setTimeout(nextQuestion, 2000);
            } else {
                errorCount++;
                // Track specific error for the modal and PDF
                errorDetails.push(`<span class="text-[10px] text-slate-500 block uppercase tracking-wider mt-1">Szenario: "${currentQuestion.scenarioText}"</span> Du hast <b>${clickedName}</b> gewählt, gesucht war aber <b>${currentQuestion.name}</b>.`);
                
                document.getElementById('statFehler').textContent = errorCount;
                btnElement.classList.add('border-rose-500', 'ring-4', 'ring-rose-500/50', 'wiggle', 'z-10');
                
                const errOverlay = document.createElement('div');
                errOverlay.className = 'absolute inset-0 bg-rose-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center gap-2 z-20 p-2 text-center';
                errOverlay.innerHTML = `
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-rose-600 text-white flex items-center justify-center text-2xl shadow-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                    <span class="bg-rose-700 text-white font-extrabold text-xs sm:text-sm px-3.5 py-1 rounded-full shadow-md border border-rose-400/30">
                        Falsch
                    </span>
                `;
                btnElement.appendChild(errOverlay);
                
                // Highlight the correct option
                const correctBtn = Array.from(allBtns).find(b => b.dataset.id === currentQuestion.id);
                if(correctBtn) {
                    correctBtn.classList.add('border-emerald-500', 'ring-4', 'ring-emerald-500/50', 'pop-success', 'z-10');
                    const correctOverlay = document.createElement('div');
                    correctOverlay.className = 'absolute inset-0 bg-emerald-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center gap-2 z-20 p-2 text-center';
                    correctOverlay.innerHTML = `
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center text-2xl shadow-xl">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <span class="bg-emerald-600 text-white font-extrabold text-xs sm:text-sm px-3.5 py-1 rounded-full shadow-lg border border-emerald-400/40">
                            Richtiges Kabel ✓
                        </span>
                    `;
                    correctBtn.appendChild(correctOverlay);
                }
                
                setTimeout(nextQuestion, 2000);
            }
        }

        function endQuiz() {
            quizActive = false;
            clearInterval(timerInterval);
            const elapsed = performance.now() - startTime;
            
            const correctAnswers = correctCount;
            const passedThisRun = (correctAnswers >= MIN_CORRECT_TO_PASS);

            // Score Logic (Max 1600, -50 per error, -time bonus)
            let base = 1600;
            let errPenalty = errorCount * 100;
            let timePenalty = Math.max(0, Math.floor(elapsed / 1000) - 30) * 5; // Penalty after 30s
            finalScore = Math.max(0, base - errPenalty - timePenalty);

            document.getElementById('statPunkte').textContent = finalScore;

            if(passedThisRun) {
                hasPassed = true;
                localStorage.setItem('a4_passed', 'true');
                localStorage.setItem('onedrive_a4_worksheet_8sek', JSON.stringify({ percent: 100 }));
                localStorage.setItem('a4_last_score', finalScore);
                localStorage.setItem('a4_last_errors', errorCount);
                localStorage.setItem('a4_last_time', formatTime(elapsed));
                localStorage.setItem('a4_last_errdetails', JSON.stringify(errorDetails));
                updateProgress();

                document.getElementById('modalTitle').textContent = errorCount === 0 ? "Test fehlerfrei bestanden! 🎉" : "Test bestanden! 🎉";
                document.getElementById('modalSubtitle').textContent = `${correctAnswers} von ${TOTAL_QUESTIONS} Fragen richtig beantwortet.`;
                document.getElementById('modalIcon').className = "fa-solid fa-award";
                document.getElementById('modalIconWrapper').className = "w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-3xl font-bold mx-auto mb-2 shadow-inner";
                document.getElementById('modalPdfBtn').classList.remove('hidden');
            } else {
                document.getElementById('modalTitle').textContent = "Nicht bestanden";
                document.getElementById('modalSubtitle').textContent = `Für das Zertifikat müssen mindestens ${MIN_CORRECT_TO_PASS} von ${TOTAL_QUESTIONS} Fragen richtig beantwortet werden (Du hattest ${errorCount} Fehler, nur ${correctAnswers} richtig).`;
                document.getElementById('modalIcon').className = "fa-solid fa-xmark";
                document.getElementById('modalIconWrapper').className = "w-16 h-16 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-400 flex items-center justify-center text-3xl font-bold mx-auto mb-2 shadow-inner";
                document.getElementById('modalPdfBtn').classList.add('hidden');
            }

            document.getElementById('modalPoints').textContent = finalScore;
            document.getElementById('modalErrors').textContent = errorCount;
            document.getElementById('modalTime').textContent = formatTime(elapsed);
            
            // Populate Error List in Modal
            const errorListEl = document.getElementById('modalErrorList');
            if(errorDetails.length > 0) {
                errorListEl.classList.remove('hidden');
                errorListEl.innerHTML = '<div class="font-bold text-rose-600 dark:text-rose-400 mb-2">Deine Fehler:</div>' + 
                                        errorDetails.map(e => `<div class="mb-3 border-l-2 border-rose-300 dark:border-rose-700 pl-2">❌ ${e}</div>`).join('');
            } else {
                errorListEl.classList.add('hidden');
            }

            document.getElementById('modal').classList.remove('hidden');
        }

        function confirmReset() {
            if(confirm('Möchtest du deinen Fortschritt für A4 zurücksetzen?')) {
                localStorage.removeItem('a4_passed');
                localStorage.removeItem('onedrive_a4_worksheet_8sek');
                localStorage.removeItem('a4_last_score');
                localStorage.removeItem('a4_last_errors');
                localStorage.removeItem('a4_last_time');
                localStorage.removeItem('a4_last_errdetails');
                location.reload();
            }
        }

        function handleDownloadPdf() {
            if(!hasPassed) {
                alert(`Bitte schließe zuerst den Praxis-Test mit mindestens ${MIN_CORRECT_TO_PASS} von ${TOTAL_QUESTIONS} richtigen Antworten ab.`);
                return;
            }

            // Load from storage if available, else use current vars (if they just finished)
            const savedScore = localStorage.getItem('a4_last_score') || finalScore;
            const savedErrors = localStorage.getItem('a4_last_errors') || errorCount;
            const savedTime = localStorage.getItem('a4_last_time') || document.getElementById('statZeit').textContent;
            let details = errorDetails;
            if (localStorage.getItem('a4_last_errdetails')) {
                try { details = JSON.parse(localStorage.getItem('a4_last_errdetails')); } catch(e) {}
            }

            const savedCorrect = TOTAL_QUESTIONS - savedErrors;

            const blocks = [
                {
                    type: 'stats',
                    items: [
                        { label: 'Richtige Antworten', value: savedCorrect + ' / ' + TOTAL_QUESTIONS, color: '#059669' },
                        { label: 'Benötigte Zeit', value: savedTime },
                        { label: 'Punkte', value: String(savedScore) }
                    ]
                }
            ];

            if (details.length > 0) {
                blocks.push({
                    type: 'text',
                    heading: '🔍 Fehleranalyse',
                    lines: details.map(e => e.replace(/<[^>]+>/g, '')) // HTML-Tags aus den Fehlertexten entfernen
                });
            } else {
                blocks.push({
                    type: 'summary',
                    label: '⭐ Fehlerfreie Leistung!',
                    note: 'Es wurden alle Kabel auf Anhieb korrekt zugeordnet.',
                    value: ''
                });
            }

            document.getElementById('modal').classList.add('hidden');

            downloadCertificatePDF({
                icon: '🔌',
                title: 'Leistungsnachweis A4 • Kabel & Anschlüsse',
                subtitle: 'Informatische Bildung • IT-Hardware • A4',
                badge: '✅ Praxis-Test bestanden (' + savedCorrect + '/' + TOTAL_QUESTIONS + ')',
                badgeOk: true,
                filenamePrefix: 'A4_Kabel_Anschluesse',
                blocks: blocks
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('ib-theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-amber-400 text-sm';
            }

            if (hasPassed) {
                const savedErrors = Number.parseInt(localStorage.getItem('a4_last_errors'), 10);
                correctCount = Number.isInteger(savedErrors)
                    ? Math.max(0, Math.min(TOTAL_QUESTIONS, TOTAL_QUESTIONS - savedErrors))
                    : TOTAL_QUESTIONS;
            }

            syncInputs();
            updateProgress();
            renderStudyMode();
        });
    </script>
    <script src="assets/js/pdf-engine.js"></script>
</body>
</html>
