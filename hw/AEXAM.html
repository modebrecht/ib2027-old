<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEXAM: Hardware-Wissenstest</title>
<script src="assets/js/tailwind.min.js"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{onedrive:{500:'#0078d4',600:'#106ebe',700:'#005a9e'}},fontFamily:{sans:['Segoe UI','Inter','system-ui','sans-serif']}}}};
</script>
<link rel="stylesheet" href="assets/css/fontawesome.min.css">
<style>
@import url('assets/fonts/inter.css');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Inter',system-ui,sans-serif}
.card{background:white;border:1px solid #e2e8f0;border-radius:1rem}
.dark .card{background:#0f172a;border-color:#334155}
.field{width:100%;border:1px solid #cbd5e1;border-radius:.75rem;padding:.65rem .75rem;background:#fff}
.dark .field{background:#1e293b;border-color:#475569;color:#f8fafc}
.btn{border-radius:.75rem;padding:.6rem .85rem;font-weight:700}
@media(max-width:640px){.mobile-stack{grid-template-columns:1fr!important}}
</style>
</head>
<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
<header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 border-b border-slate-200 dark:border-slate-800">
 <div class="max-w-[1400px] mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-3">
  <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-onedrive-500 text-white flex items-center justify-center"><i class="fa-solid fa-clipboard-check"></i></div>
   <div><div class="text-[10px] uppercase font-bold text-slate-400">AEXAM</div><div id="headerPercentText" class="text-sm font-extrabold text-onedrive-600">0% beantwortet</div></div>
  </div>
  <div class="flex gap-2">
   <button class="btn border border-slate-300 dark:border-slate-700" onclick="toggleDarkMode()"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
   <button id="pdfBtn" class="btn bg-slate-200 dark:bg-slate-800 text-slate-400 opacity-60" onclick="downloadPdf()"><i class="fa-solid fa-file-pdf"></i></button>
   <button class="btn border border-rose-300 text-rose-600" onclick="resetExam()"><i class="fa-solid fa-rotate-right"></i></button>
  </div>
 </div>
 <div class="h-1 bg-slate-200 dark:bg-slate-800"><div id="progressBar" class="h-1 bg-onedrive-500" style="width:0%"></div></div>
</header>

<main class="max-w-[1400px] mx-auto px-3 sm:px-6 py-5 space-y-4">
 <section class="card p-4 sm:p-5">
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
   <div><div class="text-xs uppercase tracking-wider font-bold text-onedrive-600">Abschluss</div><h1 class="text-xl sm:text-2xl font-black mt-1">Hardware-Wissenstest</h1>
   <p class="text-sm text-slate-500 mt-1">20 Fragen: <strong>10 Komponenten + 10 Schnittstellen</strong>. Bestanden ab <strong>16/20</strong>.</p></div>
   <div class="grid grid-cols-3 gap-2 min-w-0 sm:min-w-[400px] text-xs">
    <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-2"><span class="block text-[9px] uppercase text-slate-400 font-bold">Vorname</span><span id="metaName">–</span></div>
    <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-2"><span class="block text-[9px] uppercase text-slate-400 font-bold">Klasse</span><span id="metaClass">B24</span></div>
    <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-2"><span class="block text-[9px] uppercase text-slate-400 font-bold">Datum</span><span id="metaDate">–</span></div>
   </div>
  </div>
  <div class="hidden"><input id="studentName" readonly><input id="studentClass" readonly value="B24"><input id="studentDate" readonly></div>
 </section>

 <section class="grid grid-cols-3 gap-2">
  <div class="card p-3 text-center"><div class="text-[10px] uppercase font-bold text-slate-400">Beantwortet</div><div id="statAnswered" class="text-xl font-black">0/20</div></div>
  <div class="card p-3 text-center"><div class="text-[10px] uppercase font-bold text-slate-400">Richtig</div><div id="statCorrect" class="text-xl font-black text-emerald-600">0</div></div>
  <div class="card p-3 text-center"><div class="text-[10px] uppercase font-bold text-slate-400">Status</div><div id="statStatus" class="text-sm font-black">Offen</div></div>
 </section>

 <section id="examGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></section>
 <section id="resultBox" class="card p-5 text-sm font-bold">Beantworte alle 20 Fragen.</section>
</main>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 translate-y-8 opacity-0 transition-all bg-slate-900 text-white px-4 py-3 rounded-xl text-sm font-bold z-50"></div>
<script src="assets/js/worksheet-common.js"></script><script src="assets/js/pdf-engine.js"></script>
<script>
const STORAGE_KEY='onedrive_aexam_worksheet_8sek',LEGACY_AUTOSAVE_KEY='hw_autosave_AEXAM.html';
const QUESTIONS=[{"q":"PC-Gehäuse: Welche Hauptfunktion erfüllt es?","o":["Es führt Rechenoperationen aus.","Es schützt Bauteile und unterstützt einen gezielten Luftstrom.","Es speichert Dateien dauerhaft."],"c":1,"group":"Komponenten"},{"q":"Mainboard: Warum gilt es als Zentrale des PCs?","o":["Es verbindet die Bauteile und ermöglicht deren Datenaustausch.","Es ersetzt das Netzteil.","Es ist nur für die Bildausgabe zuständig."],"c":0,"group":"Komponenten"},{"q":"CPU: Wo befindet sie sich typischerweise?","o":["Im CPU-Sockel auf dem Mainboard.","Im Netzteil.","Direkt im Monitor."],"c":0,"group":"Komponenten"},{"q":"RAM: Was trifft zu?","o":["Er speichert Daten dauerhaft ohne Strom.","Er ist schneller Arbeitsspeicher und verliert Inhalte ohne Strom.","Er ist ein Anschluss für Monitore."],"c":1,"group":"Komponenten"},{"q":"SSD und HDD: Wofür werden sie hauptsächlich verwendet?","o":["Für dauerhafte Datenspeicherung.","Nur für WLAN.","Nur zur Kühlung."],"c":0,"group":"Komponenten"},{"q":"GPU/Grafikkarte: Welche Aufgabe hat sie?","o":["Grafik und Bildberechnung.","Strom in 230 V umwandeln.","Tastatureingaben speichern."],"c":0,"group":"Komponenten"},{"q":"Netzteil (PSU): Was macht es?","o":["Es versorgt PC-Komponenten mit passenden Spannungen.","Es ist ein Massenspeicher.","Es ersetzt die CPU."],"c":0,"group":"Komponenten"},{"q":"CPU-Kühler: Warum ist er wichtig?","o":["Damit Wärme von der CPU abgeführt wird.","Damit Dateien schneller gespeichert werden.","Damit der PC WLAN empfängt."],"c":0,"group":"Komponenten"},{"q":"Welches Gerät ist hauptsächlich ein Eingabegerät?","o":["Tastatur","Monitor","Lautsprecher"],"c":0,"group":"Komponenten"},{"q":"Welches Gerät ist hauptsächlich ein Ausgabegerät?","o":["Maus","Mikrofon","Monitor"],"c":2,"group":"Komponenten"},{"q":"Welches Merkmal trifft auf USB-A zu?","o":["Rechteckig und nur in einer Richtung einsteckbar.","Immer beidseitig einsteckbar.","Überträgt ausschliesslich Bild."],"c":0,"group":"Schnittstellen"},{"q":"Was ist ein wichtiger Vorteil von USB-C?","o":["Beidseitig einsteckbar und je nach Port vielseitig nutzbar.","Es ist immer ein analoger Anschluss.","Es benötigt Schrauben."],"c":0,"group":"Schnittstellen"},{"q":"Was überträgt HDMI typischerweise?","o":["Digitales Bild und Ton.","Nur 230-V-Strom.","Nur Netzwerkdaten."],"c":0,"group":"Schnittstellen"},{"q":"Wofür wird DisplayPort hauptsächlich eingesetzt?","o":["Für digitale Monitorverbindungen.","Für Stromversorgung des PC-Netzteils.","Für analoge Mikrofone."],"c":0,"group":"Schnittstellen"},{"q":"Warum gilt VGA heute als veraltet?","o":["Es überträgt analoges Bild und keinen Ton.","Es ist ein USB-Standard.","Es funktioniert nur drahtlos."],"c":0,"group":"Schnittstellen"},{"q":"Woran erkennt man DVI typischerweise?","o":["Breiter Stecker mit Pin-Raster und Schrauben.","Runder 3,5-mm-Stecker.","Kleiner Netzwerkclip."],"c":0,"group":"Schnittstellen"},{"q":"Wozu dient RJ45/Ethernet?","o":["Kabelgebundene Netzwerkverbindung.","Stromversorgung des Netzteils.","Analoge Bildübertragung."],"c":0,"group":"Schnittstellen"},{"q":"Wozu dient ein Stromkabel C13 am Desktop-PC?","o":["Es verbindet das Netzteil mit der Steckdose.","Es überträgt Audiosignale.","Es erweitert USB-Anschlüsse."],"c":0,"group":"Schnittstellen"},{"q":"Wozu dient ein USB-Hub?","o":["Er erweitert einen USB-Anschluss auf mehrere.","Er kühlt die CPU.","Er ersetzt den Router."],"c":0,"group":"Schnittstellen"},{"q":"Wo wird eine SD-Karte häufig eingesetzt?","o":["Als entnehmbarer Speicher, z. B. in Kameras.","Als Stromstecker für das Netzteil.","Als Monitoranschluss."],"c":0,"group":"Schnittstellen"}];
let currentPercentage=0,saveTimer=null;

function render(){
 const g=document.getElementById('examGrid');
 g.innerHTML=QUESTIONS.map((q,i)=>`<fieldset class="card p-4" data-q="${i}">
   <legend class="font-black text-sm px-1"><span class="text-onedrive-600">${i+1}.</span> ${q.q}</legend>
   <div class="text-[10px] uppercase font-bold text-slate-400 mt-1">${q.group}</div>
   <div class="space-y-2 mt-3">${q.o.map((o,j)=>`<label class="flex items-start gap-2 text-sm cursor-pointer"><input class="mt-1 accent-onedrive-500" type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>
  </fieldset>`).join('');
}
function score(){
 let answered=0,correct=0;QUESTIONS.forEach((q,i)=>{const s=document.querySelector(`input[name="q${i}"]:checked`);if(s){answered++;if(Number(s.value)===q.c)correct++;}});
 return{answered,correct,passed:answered===QUESTIONS.length&&correct>=16};
}
function update(){
 const s=score();const answeredPct=Math.round(s.answered/QUESTIONS.length*100);
 currentPercentage=s.passed?100:Math.min(99,answeredPct);
 document.getElementById('headerPercentText').textContent=s.passed?'100% · bestanden':answeredPct+'% beantwortet';
 document.getElementById('progressBar').style.width=currentPercentage+'%';
 document.getElementById('statAnswered').textContent=s.answered+'/'+QUESTIONS.length;document.getElementById('statCorrect').textContent=s.correct;
 document.getElementById('statStatus').textContent=s.passed?'Bestanden':(s.answered===QUESTIONS.length?'Noch nicht bestanden':'Offen');
 const box=document.getElementById('resultBox');
 if(s.answered<QUESTIONS.length){box.textContent='Beantworte alle 20 Fragen. Noch '+(QUESTIONS.length-s.answered)+' offen.';box.className='card p-5 text-sm font-bold';}
 else if(s.passed){box.textContent='✓ '+s.correct+'/20 richtig. AEXAM bestanden.';box.className='card p-5 text-sm font-bold bg-emerald-50 dark:bg-emerald-950 text-emerald-700';}
 else{box.textContent=s.correct+'/20 richtig. Für das Bestehen brauchst du 16/20. Verbessere die markierten Antworten.';box.className='card p-5 text-sm font-bold bg-amber-50 dark:bg-amber-950 text-amber-700';}
 if(s.answered===QUESTIONS.length)document.querySelectorAll('[data-q]').forEach((f,i)=>{const r=f.querySelector('input:checked');f.classList.remove('ring-2','ring-emerald-400','ring-amber-400');if(r)f.classList.add('ring-2',Number(r.value)===QUESTIONS[i].c?'ring-emerald-400':'ring-amber-400')});
 const b=document.getElementById('pdfBtn');if(s.passed){b.className='btn bg-emerald-600 text-white';b.title='PDF herunterladen'}else{b.className='btn bg-slate-200 dark:bg-slate-800 text-slate-400 opacity-60';b.title='PDF nach bestandenem Test'}
}
function collect(){const answers={};QUESTIONS.forEach((_,i)=>{const s=document.querySelector(`input[name="q${i}"]:checked`);if(s)answers['q'+i]=Number(s.value)});const s=score();return{version:3,answers,answered:s.answered,correct:s.correct,passed:s.passed,percent:currentPercentage,updatedAt:new Date().toISOString()}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const d=JSON.parse(raw),a=d.answers||{};Object.entries(a).forEach(([k,v])=>{const i=k.replace('q','');const r=document.querySelector(`input[name="q${i}"][value="${v}"]`);if(r)r.checked=true})}catch(e){console.warn(e)}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(collect()))}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,120)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('translate-y-8','opacity-0');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('translate-y-8','opacity-0'),2200)}
function resetExam(){if(!confirm('AEXAM vollständig zurücksetzen?'))return;localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(LEGACY_AUTOSAVE_KEY);document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);update();save()}
function downloadPdf(){
 const s=score();if(!s.passed){toast('PDF erst nach bestandenem Test (mind. 16/20)');return}if(typeof downloadTextWorksheetPDF!=='function'){toast('PDF-Modul nicht geladen');return}
 const sections=[{heading:'Ergebnis',fields:[{label:'Punkte',value:s.correct+' / '+QUESTIONS.length},{label:'Status',value:'Bestanden'}]},
  ...QUESTIONS.map((q,i)=>{const sel=document.querySelector(`input[name="q${i}"]:checked`);return{heading:(i+1)+'. '+q.q,fields:[{label:'Antwort',value:q.o[Number(sel.value)]},{label:'Bewertung',value:Number(sel.value)===q.c?'Richtig':'Falsch'}]}})
 ];downloadTextWorksheetPDF({title:'AEXAM · Hardware-Wissenstest',filenamePrefix:'AEXAM_Hardware-Wissenstest',sections});
}
function syncMeta(){[['studentName','metaName'],['studentClass','metaClass'],['studentDate','metaDate']].forEach(([a,b])=>{const s=document.getElementById(a),d=document.getElementById(b);if(s&&d)d.textContent=s.value||'–'})}
document.addEventListener('DOMContentLoaded',()=>{render();if(typeof applyDefaultClassAndDate==='function')applyDefaultClassAndDate();load();document.querySelectorAll('input[type=radio]').forEach(r=>r.addEventListener('change',()=>{update();scheduleSave()}));update();syncMeta();setTimeout(()=>{syncMeta();save()},400)});
</script></body></html>
