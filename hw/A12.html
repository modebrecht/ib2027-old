<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A12: Grüne IT & Nachhaltigkeit</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="sheet" src="A23.html" title="A12: Grüne IT & Nachhaltigkeit"></iframe>
  <script src="assets/js/pdf-engine.js"></script>
  <script>
    const frame=document.getElementById('sheet');
    function relabel(){
      try{
        const d=frame.contentDocument;
        if(!d)return;
        d.title=d.title.replace(/A9/g,'A12');
        const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
        const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
        nodes.forEach(n=>{if(n.nodeValue&&n.nodeValue.includes('A9'))n.nodeValue=n.nodeValue.replace(/A9/g,'A12')});
      }catch(e){}
    }
    function exportA12Pdf(){
      try{
        const d=frame.contentDocument;
        if(!d)return;
        const value=id=>((d.getElementById(id)||{}).value||'').trim();
        downloadDomWorksheetPDF({
          root:d.querySelector('main')||d.body,
          title:'A12 · Grüne IT & Nachhaltigkeit',
          subtitle:'Informatische Bildung · IT-Hardware · Nachhaltigkeit',
          filenamePrefix:'A12_Gruene_IT',
          meta:{name:value('studentName')||'Unbenannt',cls:value('studentClass')||'9. Klasse',date:value('studentDate')||new Date().toLocaleDateString('de-CH')},
          heading:'Bearbeitetes Arbeitsblatt'
        });
      }catch(e){console.error('A12 PDF export failed:',e)}
    }
    function installPdfBridge(){
      try{
        if(frame.contentWindow)frame.contentWindow.safePrint=exportA12Pdf;
      }catch(e){}
    }
    frame.addEventListener('load',()=>{relabel();installPdfBridge();setTimeout(()=>{relabel();installPdfBridge()},250)});
  </script>
</body>
</html>
