name: Sync ib2026 main into ib2027 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-from-ib2026-main-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ib2027
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch ib2026 main
        run: git clone --depth 1 --branch main https://github.com/modebrecht/ib2026.git /tmp/ib2026

      - name: Mirror files except workflows
        run: rsync -a --delete --exclude '.git' --exclude '.github/workflows' /tmp/ib2026/ ./

      - name: Commit synced snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: ib2026 main -> ib2027 main (content)"
          git push origin main
