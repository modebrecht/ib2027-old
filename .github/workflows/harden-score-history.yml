name: HW Score Regression Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/ib2026-http.log 2>&1 &
          sleep 1

      - name: Run score regression suite
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test e2e/hw-score-history-fast.spec.js --browser=chromium --workers=1 --reporter=line
