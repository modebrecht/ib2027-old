name: Bootstrap stable snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy ib2026 main snapshot
        run: |
          git clone --depth 1 --branch main https://github.com/modebrecht/ib2026.git /tmp/ib2026
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/ib2026/ ./

      - name: Commit stable baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: snapshot ib2026 main as stable baseline"
          git push origin HEAD:main
